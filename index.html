<title>Шахматен път</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Rubik:wght@500;700;800&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Концепция: тренировъчна пътека. Тъмно мастилено синьо, шафран за звездите, зелено за „действай". Дъска в студени сиво-сини тонове. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#E4EAF2; --ink:#12213B; --muted:#586884; --line:#D3DCE9;
  --go:#0B8F6A; --go-ink:#FFFFFF; --star:#F2A900; --bad:#D4453C; --ok:#0B8F6A; --focus:#1B5FD6;
  --sq-l:#EDF1F5; --sq-d:#86A6B8; --sel:rgba(242,169,0,.55); --last:rgba(11,143,106,.28); --chk:rgba(212,69,60,.55);
  --pc-w:#FFFFFF; --pc-b:#16233D; --pc-stroke:#16233D; --pc-stroke-b:#AEBCD3;
  --disp:'Rubik','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sym:'Noto Sans Symbols 2','Segoe UI Symbol','DejaVu Sans',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#142036; --surface2:#1B2B47; --ink:#EAF0FA; --muted:#9DAAC4; --line:#27385A;
  --go:#34CDA0; --go-ink:#06241B; --star:#FFC233; --bad:#FF7B70; --ok:#34CDA0; --focus:#7FB0FF;
  --sq-l:#C7D4DD; --sq-d:#46687B; --sel:rgba(255,194,51,.55); --last:rgba(52,205,160,.30); --chk:rgba(255,123,112,.6);
  --pc-w:#FFFFFF; --pc-b:#0F1A2F; --pc-stroke:#0F1A2F; --pc-stroke-b:#C5D2E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#142036; --surface2:#1B2B47; --ink:#EAF0FA; --muted:#9DAAC4; --line:#27385A;
  --go:#34CDA0; --go-ink:#06241B; --star:#FFC233; --bad:#FF7B70; --ok:#34CDA0; --focus:#7FB0FF;
  --sq-l:#C7D4DD; --sq-d:#46687B; --sel:rgba(255,194,51,.55); --last:rgba(52,205,160,.30); --chk:rgba(255,123,112,.6);
  --pc-w:#FFFFFF; --pc-b:#0F1A2F; --pc-stroke:#0F1A2F; --pc-stroke-b:#C5D2E8; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;
  padding-block:0 92px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sq:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tiny{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.rank{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--sym);font-size:28px;line-height:1;flex:none}
.brand b{font-family:var(--disp);font-weight:800;font-size:1.1rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.9rem;white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.sync{font-size:.74rem;color:var(--muted);text-align:right}

/* layout bits */
main{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-family:var(--disp);background:var(--go);color:var(--go-ink);font-size:1rem;min-height:48px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .4s}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars svg{width:16px;height:16px}
.stars .off{color:var(--line)}

/* today */
.hero h1{font-size:1.6rem;font-weight:800}
.week{display:flex;gap:8px;margin-top:12px}
.week i{flex:1;max-width:44px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800;color:var(--muted)}
.week i.on{background:var(--go);color:var(--go-ink)}
.week i.today{outline:2px solid var(--ink);outline-offset:1px}
.mission .dots{display:flex;gap:8px;margin:12px 0}
.mission .dots b{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem}
.mission .dots b.done{background:var(--go);color:var(--go-ink)}
.rule{border-left:6px solid var(--star)}
.rule h3{margin-bottom:4px}
.rule ol{margin:8px 0 0;padding-left:20px}

/* levels */
.lv{display:grid;grid-template-columns:52px 1fr;gap:14px}
.lv .no{width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--sym);font-size:30px}
.lv.locked{opacity:.62}
.lv.locked .no{background:var(--surface2);color:var(--muted)}
.lv.cleared .no{background:var(--go);color:var(--go-ink)}
.dotsr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pd{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:.82rem;display:grid;place-items:center;padding:0}
.pd.s1{background:#F2A90033;border-color:var(--star)}
.pd.s2{background:#F2A90066;border-color:var(--star)}
.pd.s3{background:var(--star);border-color:var(--star);color:#12213B}
.pd.seen{border-style:dashed}

/* board */
.boardwrap{width:100%;max-width:520px;margin:0 auto;position:relative}
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid var(--ink);user-select:none;touch-action:manipulation}
.sq{position:relative;display:grid;place-items:center;background:var(--sq-l);padding:0;border:0;border-radius:0;font-family:var(--sym);font-size:10.2cqw;line-height:1;min-width:0;min-height:0}
.sq.d{background:var(--sq-d)}
.sq.last::after,.sq.sel::after,.sq.chk::after{content:"";position:absolute;inset:0}
.sq.last::after{background:var(--last)}
.sq.sel::after{background:var(--sel)}
.sq.chk::after{background:radial-gradient(circle,var(--chk) 0,transparent 75%)}
.sq.hint::after{content:"";position:absolute;inset:6%;border:4px solid var(--focus);border-radius:50%}
.sq .p{position:relative;z-index:1;display:block;transform:translateY(-3%)}
.sq .p.w{color:var(--pc-w);-webkit-text-stroke:.03em var(--pc-stroke);paint-order:stroke fill;text-shadow:0 .02em 0 var(--pc-stroke)}
.sq .p.b{color:var(--pc-b);-webkit-text-stroke:.012em var(--pc-stroke-b);paint-order:stroke fill}
.sq .tg{position:absolute;z-index:2;width:30%;height:30%;border-radius:50%;background:rgba(18,33,59,.35)}
.sq .tg.cap{width:86%;height:86%;background:transparent;border:.09em solid rgba(18,33,59,.45)}
.sq .cf,.sq .cr{position:absolute;z-index:2;font-family:var(--body);font-weight:800;font-size:.17em;line-height:1;opacity:.8;color:var(--ink)}
.sq .cf{right:5%;bottom:4%}
.sq .cr{left:5%;top:4%}
.veil{position:absolute;inset:0;border-radius:12px;background:rgba(11,19,34,.82);display:grid;place-items:center;text-align:center;color:#fff;padding:18px;z-index:4}
.veil .big{font-family:var(--disp);font-weight:800;font-size:4.6rem;line-height:1}
.veil p{max-width:26ch;margin:8px auto 0}
.ringbar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;width:min(260px,70%);margin:14px auto 0}
.ringbar i{display:block;height:100%;background:var(--star);width:0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.bar>i{transition:none}}
.msg{min-height:3.2em;font-weight:600}
.msg.good{color:var(--ok)}
.msg.bad{color:var(--bad)}
.turn{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.chip{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.chip.w{background:#fff}.chip.b{background:var(--ink)}
.result{text-align:center}
.result .stars svg{width:34px;height:34px}

/* forms */
label{display:block;font-weight:800;font-size:.88rem;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.fgrid{grid-template-columns:1fr}}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px;font-weight:800;min-height:46px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.log{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.tag{display:inline-block;font-size:.76rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface2);margin-right:4px}
.tag.w{background:#0B8F6A26;color:var(--ok)}.tag.l{background:#D4453C26;color:var(--bad)}

/* report */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stat b{display:block;font-family:var(--disp);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .goal{display:block;margin-top:6px;font-size:.8rem;font-weight:800}
.goal.ok{color:var(--ok)}.goal.no{color:var(--bad)}.goal.na{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px}
.chart div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.chart i{display:block;width:100%;background:var(--go);border-radius:6px 6px 2px 2px;min-height:3px}
.chart span{font-size:.7rem;color:var(--muted);font-weight:800}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);opacity:.5}
.badge.on{opacity:1;background:var(--surface)}
.badge svg{width:30px;height:30px;flex:none;color:var(--star)}
.badge b{font-size:.86rem;line-height:1.15}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:transparent;border-radius:12px;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.74rem;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;max-width:90vw}
.note{font-size:.84rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:800}
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='pn_state_v1', LKEY='pn_logs_local_v1';
var RANKS=[{n:'Пешка',g:'♟︎',xp:0},{n:'Кон',g:'♞',xp:100},{n:'Офицер',g:'♝',xp:300},{n:'Топ',g:'♜',xp:600},{n:'Дама',g:'♛',xp:1000},{n:'Цар',g:'♚',xp:1600}];
var RULES=[
 {t:'Брой до 5, преди да пипнеш фигура',l:['Погледни цялата дъска.','Шах? Взимане? Заплаха?','Чак тогава мръдни.']},

var BADGES=[
 {id:'first',n:'Първа задача'},{id:'mate',n:'Първи мат'},{id:'s3',n:'3 дни серия'},{id:'s7',n:'7 дни серия'},
 {id:'lv3',n:'Стигна ниво 3'},{id:'p50',n:'50 решени задачи'},{id:'clean',n:'Чиста партия'},{id:'end',n:'Мат в реализация'}];
var WRONG=['Не е този. Провери: шах? взимане? заплаха?','Още веднъж. Какво виси?','Почти. Погледни царя на съперника.','Спри и брой до 5, после опитай пак.'];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function z2(n){return (n<10?'0':'')+n}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())}
function addDays(s,n){var p=s.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){e.hidden=true},2600)}
var STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
function stars(n,max){max=max||3;var h='<span class="stars" aria-label="'+n+' от '+max+' звезди">';for(var i=0;i<max;i++)h+=i<n?STAR:STAR.replace('<svg','<svg class="off"');return h+'</span>'}
var ICON={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 15l2 2 4-4"/></svg>',
 path:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 000-6h-4a3 3 0 010-6h5.5"/></svg>',
 log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 017.5 2H19v17H7.5A2.5 2.5 0 005 21.5z"/><path d="M5 4.5V21.5M9 7h6M9 11h6"/></svg>',
 rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 flame:'<svg viewBox="0 0 24 24" fill="#F2A900"><path d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3.5 2-4.5C9 11 11 10 11 7c0-2 .5-3.5 1-5z"/></svg>',
 xp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 medal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M8.5 3l3.5 6 3.5-6M10 15l1.5 1.5L14.5 13"/></svg>'
};

/* ---------- state ---------- */
function DEF(){return{rev:0,xp:0,prog:{},days:{},badges:{},mission:null,li:{days:{}},set:{pause:5,name:'Шахматист'}}}
var S=DEF();
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(DEF(),JSON.parse(raw));S.set=Object.assign({pause:5,name:'Шахматист'},S.set||{})}}catch(e){}
var LOGS_DB=[], LOGS_LOCAL=[];
try{LOGS_LOCAL=JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){LOGS_LOCAL=[]}
var db=null, stateRef=null, logsRef=null, syncNote='', dirty=false, sending=false, flushTimer=null;

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function persist(){S.rev=(S.rev||0)+1;saveLocal();dirty=true;clearTimeout(flushTimer);flushTimer=setTimeout(flush,700)}
function flush(){
  if(!stateRef||sending||!dirty)return;
  sending=true;dirty=false;
  stateRef.set(clone(S)).then(function(){syncNote=''},function(){syncNote='local'}).then(function(){sending=false;if(dirty)flush();paintSync()});
}
function allLogs(){
  var a=LOGS_DB.concat(LOGS_LOCAL.map(function(l){return Object.assign({local:true},l)}));
  a.sort(function(x,y){return (y.ts||0)-(x.ts||0)});return a;
}
function addLog(entry){
  entry.ts=Date.now();
  if(logsRef){
    return logsRef.add(entry).then(function(){return true},function(){LOGS_LOCAL.push(entry);try{localStorage.setItem(LKEY,JSON.stringify(LOGS_LOCAL))}catch(e){}syncNote='local';return false});
  }
  LOGS_LOCAL.push(entry);try{localStorage.setItem(LKEY,JSON.stringify(LOGS_LOCAL))}catch(e){}
  return Promise.resolve(false);
}
function delLog(l){
  if(l.local){LOGS_LOCAL=LOGS_LOCAL.filter(function(x){return x.ts!==l.ts});try{localStorage.setItem(LKEY,JSON.stringify(LOGS_LOCAL))}catch(e){}render();return}
  if(logsRef)logsRef.doc(l.id).delete().then(function(){},function(){toast('Не успях да изтрия. Опитай пак.')});
}
function initDb(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('db').then(function(d){
    if(!d)return;db=d;stateRef=db.doc('app/state');logsRef=db.collection('logs');
    var t=setTimeout(function(){syncNote='local';paintSync()},10000);
    stateRef.onSnapshot(function(snap){
      clearTimeout(t);
      if(snap.exists){
        var r=snap.data()||{};
        if((r.rev||0)>(S.rev||0)){S=Object.assign(DEF(),clone(r));S.set=Object.assign({pause:5,name:'Шахматист'},S.set||{});saveLocal();render()}
        else if((r.rev||0)<(S.rev||0)){dirty=true;flush()}
      }else if((S.rev||0)>0){dirty=true;flush()}
      syncNote='';paintSync();
    },function(){clearTimeout(t);syncNote='local';paintSync()});
    logsRef.orderBy('ts','desc').limit(400).onSnapshot(function(snap){
      LOGS_DB=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      if(LOGS_LOCAL.length){var pend=LOGS_LOCAL.slice();LOGS_LOCAL=[];try{localStorage.setItem(LKEY,'[]')}catch(e){}pend.forEach(function(e){logsRef.add(e).catch(function(){LOGS_LOCAL.push(e)})})}
      if(view==='log'){var ll=$('#loglist');if(ll)ll.innerHTML=logListHTML()}else if(view==='report')render();
    },function(){});
  },function(){});
}

/* ---------- derived ---------- */
function lvStats(l){
  var ps=PUZ.filter(function(p){return p.lv===l.n}),solved=0,st=0;
  ps.forEach(function(p){var r=S.prog[p.id];if(r&&r.st>0){solved++;st+=r.st}});
  var need=Math.ceil(ps.length*0.7);
  return{n:ps.length,solved:solved,stars:st,need:need,cleared:ps.length>0&&solved>=need&&st>=2*need,max:3*ps.length};
}
function isUnlocked(l){return l.n===1||lvStats(LEVELS[l.n-2]).cleared}
function currentLevel(){for(var i=0;i<LEVELS.length;i++){if(isUnlocked(LEVELS[i])&&!lvStats(LEVELS[i]).cleared)return LEVELS[i]}return LEVELS[LEVELS.length-1]}
function rankOf(xp){var r=RANKS[0];RANKS.forEach(function(x){if(xp>=x.xp)r=x});var i=RANKS.indexOf(r);return{r:r,next:RANKS[i+1]||null}}
function activeDays(){var a={};Object.keys(S.days).forEach(function(k){if(S.days[k].n>0)a[k]=1});var L=(S.li&&S.li.days)||{};Object.keys(L).forEach(function(k){if(L[k].n>0)a[k]=1});return a}
function streak(){
  var a=activeDays(),cur=ymd(),n=0,gap=0,guard=0;
  while(guard++<500){if(a[cur]){n++;gap=0}else{gap++;if(gap>=2)break}cur=addDays(cur,-1)}
  return n;
}
function solvedCount(){var c=0;Object.keys(S.prog).forEach(function(k){if(S.prog[k].st>0)c++});return c}
function pzById(id){for(var i=0;i<PUZ.length;i++)if(PUZ[i].id===id)return PUZ[i];return null}

function buildMission(){
  var today=ymd();
  if(S.mission&&S.mission.date===today)return S.mission;
  var cur=currentLevel(),ids=[];
  var unl=LEVELS.filter(isUnlocked).map(function(l){return l.n});
  var fresh=PUZ.filter(function(p){return p.lv===cur.n&&!(S.prog[p.id]&&S.prog[p.id].st>0)});
  fresh.slice(0,3).forEach(function(p){ids.push(p.id)});
  var review=PUZ.filter(function(p){var r=S.prog[p.id];return unl.indexOf(p.lv)>=0&&r&&r.st>0&&r.st<3&&ids.indexOf(p.id)<0});
  review.sort(function(a,b){return S.prog[a.id].st-S.prog[b.id].st});
  review.slice(0,2).forEach(function(p){ids.push(p.id)});
  fresh.slice(3).concat(PUZ.filter(function(p){return unl.indexOf(p.lv)>=0&&ids.indexOf(p.id)<0})).forEach(function(p){if(ids.length<5&&ids.indexOf(p.id)<0)ids.push(p.id)});
  S.mission={date:today,ids:ids,done:[],bonus:false};persist();return S.mission;
}


/* ---------- Lichess ---------- */
var TKEY='pn_li_token_v1',LI_MAX=300,liMsg='',liBusy=false,liLast=0;
function getTok(){try{return localStorage.getItem(TKEY)||''}catch(e){return ''}}
function setTok(v){try{if(v)localStorage.setItem(TKEY,v);else localStorage.removeItem(TKEY)}catch(e){}}
function LID(){if(!S.li||!S.li.days)S.li={days:{}};return S.li.days}
function liUrl(slug){return 'https://lichess.org/training'+(slug&&slug!=='mix'?'/'+slug:'')}
function liParse(txt){var out=[];String(txt).split('\n').forEach(function(l){l=l.trim();if(!l)return;try{out.push(JSON.parse(l))}catch(e){}});return out}
function liErr(e){
  if(e&&e.code==='auth')return 'Lichess не прие токена. Създай нов с право „Puzzle“ (само четене) и го постави отново.';
  if(e&&e.code==='http')return 'Lichess върна грешка ('+e.status+'). Опитай по-късно.';
  return 'Страницата не може да достигне Lichess (мрежа или ограничение на средата). Отбелязвай задачите ръчно.';
}
function liSync(){
  var tok=getTok();
  if(!tok){liMsg='Няма токен. Добави го в Отчет → Настройки.';refreshLi();return Promise.resolve()}
  if(liBusy)return Promise.resolve();
  liBusy=true;liMsg='Свързвам се с Lichess…';refreshLi();
  return fetch('https://lichess.org/api/puzzle/activity?max='+LI_MAX,{headers:{'Authorization':'Bearer '+tok,'Accept':'application/x-ndjson'}}).then(function(r){
    if(r.status===401||r.status===403)throw {code:'auth'};
    if(!r.ok)throw {code:'http',status:r.status};
    return r.text();
  }).then(function(txt){
    var rows=liParse(txt),by={},cut=addDays(ymd(),-30),oldest=null;
    rows.forEach(function(x){
      var ts=Number(x&&x.date);if(!ts)return;
      var d=ymd(new Date(ts));if(d<cut)return;
      if(oldest===null||d<oldest)oldest=d;
      var b=by[d]||(by[d]={n:0,ok:0,th:{}});b.n++;
      var w=x.win===true;if(w)b.ok++;
      var th=(x.puzzle&&x.puzzle.themes)||[];
      th.forEach(function(k){var q=b.th[k]||(b.th[k]=[0,0]);q[0]++;if(w)q[1]++});
    });
    if(rows.length>=LI_MAX&&oldest)delete by[oldest];
    var L=LID(),gain=0;
    Object.keys(by).forEach(function(d){var prev=(L[d]&&L[d].ok)||0;if(by[d].ok>prev)gain+=(by[d].ok-prev)*2;L[d]=by[d]});
    gain=Math.min(gain,40);
    if(gain>0)S.xp+=gain;
    liLast=Date.now();
    var td=by[ymd()];
    liMsg='Обновено от Lichess'+(gain>0?' · +'+gain+' т.':'')+(td?'':' · днес още няма решени задачи');
    persist();
  }).catch(function(e){liMsg=liErr(e)}).then(function(){liBusy=false;paintTop();refreshLi()});
}

   +'<div class="bar" style="margin-top:6px"><i style="width:'+(target?Math.min(100,Math.round(L.n/target*100)):(L.n?100:0))+'%"></i></div></div>';

  h+='<details open style="margin-top:12px"><summary>Отбележи ръчно, ако не се обновява</summary><div class="fgrid" style="margin-top:8px"><div><label for="li-n">Решени</label><input id="li-n" type="number" min="0" max="500" inputmode="numeric" value="'+L.n+'"></div><div><label for="li-ok">Верни</label><input id="li-ok" type="number" min="0" max="500" inputmode="numeric" value="'+L.ok+'"></div></div><div style="margin-top:8px"><button class="btn ghost sm" data-act="li-manual">Запази</button></div></details>';
  return h;
}

/* ---------- puzzle player ---------- */
var FILES='abcdefgh';
var GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎'};
function startPuzzle(p,mode,queue,qi){
  var g=new Chess(p.fen);
  PL={pz:p,g:g,idx:0,tries:0,hint:0,t0:0,ready:false,over:false,sel:null,targets:[],last:null,mode:mode,queue:queue||null,qi:qi||0,msg:'',cls:'',pause:S.set.pause|0,count:0,res:null,flip:g.turn()==='b'};
  window.scrollTo(0,0);renderPuzzle();
  if(PL.pause>0)runPause();else{PL.ready=true;PL.t0=Date.now();renderPuzzle()}
}
function runPause(){
  var P=PL,start=Date.now(),total=P.pause*1000;
  P.count=1;
  var tm=setInterval(function(){
    if(PL!==P){clearInterval(tm);return}
    var el=Date.now()-start;P.count=Math.min(P.pause,Math.floor(el/1000)+1);
    var bi=$('#pbar');if(bi)bi.style.width=Math.min(100,el/total*100)+'%';
    var big=$('#pbig');if(big)big.textContent=P.count;
    if(el>=total){clearInterval(tm);P.ready=true;P.t0=Date.now();renderPuzzle()}
  },120);
}
function sqName(r,f){return FILES[f]+(8-r)}
function boardHTML(){
  var P=PL,b=P.g.board(),h='',chk=null;
  if(P.g.in_check()){var t=P.g.turn();for(var r=0;r<8;r++)for(var f=0;f<8;f++){var c=b[r][f];if(c&&c.type==='k'&&c.color===t)chk=sqName(r,f)}}
  for(var i=0;i<8;i++)for(var j=0;j<8;j++){
    var r=P.flip?7-i:i,f=P.flip?7-j:j,nm=sqName(r,f),c=b[r][f],dark=(r+f)%2===1;
    var cl='sq'+(dark?' d':'')+(P.last&&(P.last.from===nm||P.last.to===nm)?' last':'')+(P.sel===nm?' sel':'')+(chk===nm?' chk':'')+(P.hintSq===nm?' hint':'');
    var inner='';
    if(c)inner+='<span class="p '+c.color+'">'+GL[c.type]+'</span>';
    var tg=P.targets.indexOf(nm)>=0;
    if(tg)inner+='<span class="tg'+(c?' cap':'')+'"></span>';
    if(j===0)inner+='<span class="cr">'+(8-r)+'</span>';
    if(i===7)inner+='<span class="cf">'+FILES[f]+'</span>';
    h+='<button class="'+cl+'" data-sq="'+nm+'" aria-label="'+nm+(c?' '+(c.color==='w'?'бяла':'черна')+' фигура':'')+'">'+inner+'</button>';
  }
  return h;
}
function levelOf(p){return LEVELS[p.lv-1]}
function titleFor(p){
  if(p.type==='m1')return'Мат в 1';if(p.type==='m2')return'Мат в 2';if(p.type==='m3')return'Мат в 3';
  return'Намери най-силния ход';
}
function renderPuzzle(){
  var P=PL,p=P.pz;
  $('#top').hidden=true;
  var side=P.g.turn()==='w'?'Белите':'Черните';
  var first=new Chess(p.fen).turn()==='w'?'Белите':'Черните';
  var inMission=P.mode==='mission';
  var head='<div class="row between" style="padding:14px 0 4px"><button class="btn ghost sm" data-act="quit">Назад</button>'
   +'<div style="text-align:center;min-width:0"><div class="tiny">'+(inMission?'Мисия '+(P.qi+1)+' / '+P.queue.length:'Ниво '+p.lv)+'</div><b style="font-family:var(--disp)">'+esc(titleFor(p))+'</b></div>'
   +'<span class="turn"><span class="chip '+(first==='Белите'?'w':'b')+'"></span>'+first+'</span></div>';
  var veil='';
  if(!P.ready&&P.pause>0){
    veil='<div class="veil" id="veil"><div><div class="big" id="pbig">'+P.count+'</div><p>Огледай дъската. Шах? Взимане? Заплаха?</p><div class="ringbar"><i id="pbar" style="width:0"></i></div></div></div>';
  }
  var foot='';
  if(P.res){
    var r=P.res;
    foot='<div class="card result pop" style="margin-top:14px"><div>'+stars(r.st)+'</div><h2 style="margin-top:6px">'+r.title+'</h2><p class="muted" style="margin-top:4px">'+esc(r.text)+'</p><p style="margin-top:6px;font-weight:800">+'+r.xp+' т.</p>'
     +'<div class="row wrapf" style="justify-content:center;margin-top:14px"><button class="btn" data-act="next">'+r.nextLabel+'</button></div></div>';
  }else{
    foot='<p class="msg '+P.cls+'" role="status" style="margin-top:12px">'+esc(P.msg||(P.ready?side+' играят. '+hintText(p):'Първо огледай и брой.'))+'</p>'
     +'<div class="row wrapf" style="margin-top:6px"><button class="btn ghost sm" data-act="hint"'+(P.ready&&!P.over?'':' disabled')+'>Подсказка</button>'
     +(P.tries>=3?'<button class="btn line sm" data-act="reveal">Покажи решението</button>':'')+'</div>';
  }
  $('#main').innerHTML=head+'<div class="boardwrap"><div class="board" id="board">'+boardHTML()+'</div>'+veil+'</div>'+foot;
  paintNav();
  var nav=document.querySelector('nav');nav.hidden=true;
}
function hintText(p){
  if(p.type==='t')return'Намери хода, който печели най-много.';
  return'Намери мата. Започни с шаховете.';
}
function leaveToApp(){var nav=document.querySelector('nav');nav.hidden=false;PL=null;render()}
function boardClick(nm){
  var P=PL;if(!P||!P.ready||P.over||P.res)return;
  var g=P.g,pc=g.get(nm);
  if(P.sel&&P.targets.indexOf(nm)>=0){tryMove(P.sel,nm);return}
  if(pc&&pc.color===g.turn()){
    if(P.sel===nm){P.sel=null;P.targets=[]}
    else{P.sel=nm;P.targets=g.moves({square:nm,verbose:true}).map(function(m){return m.to})}
  }else{P.sel=null;P.targets=[]}
  P.hintSq=null;repaintBoard();
}
function repaintBoard(){var b=$('#board');if(b)b.innerHTML=boardHTML()}
function tryMove(from,to){
  var P=PL,g=P.g,mv=g.move({from:from,to:to,promotion:'q'});
  P.sel=null;P.targets=[];P.hintSq=null;
  if(!mv){repaintBoard();return}
  var uci=from+to+(mv.promotion?mv.promotion:'');
  var want=P.pz.sol[P.idx];
  var last=P.idx>=P.pz.sol.length-1;
  var good=(uci===want)||(P.pz.type!=='t'&&g.in_checkmate()&&last);
  if(!good){
    g.undo();P.tries++;P.msg=WRONG[(P.tries-1)%WRONG.length];P.cls='bad';
    renderPuzzle();var bd=$('#board');if(bd){bd.classList.add('shake')}return;
  }
  P.last={from:from,to:to};P.msg='';P.cls='';
  if(last||g.in_checkmate()){finish();return}
  repaintBoard();
  P.over=true;
  setTimeout(function(){
    if(PL!==P)return;
    var rep=P.pz.sol[P.idx+1],m2=g.move({from:rep.slice(0,2),to:rep.slice(2,4),promotion:rep.length>4?rep[4]:undefined});
    P.last={from:rep.slice(0,2),to:rep.slice(2,4)};P.idx+=2;P.over=false;P.msg='Верен ход. Продължи.';P.cls='good';renderPuzzle();
  },650);
}
function finish(){
  var P=PL,p=P.pz,ms=Date.now()-P.t0;
  var st=(P.tries===0&&!P.hint)?3:(P.tries<=1||P.hint?2:1);
  if(P.tries>=2)st=1;
  var prev=S.prog[p.id]||{st:0},gain=st>(prev.st||0)?(st-(prev.st||0))*10+(prev.st?0:5):1;
  var rec=S.prog[p.id]||{};rec.st=Math.max(prev.st||0,st);rec.tr=P.tries;rec.ms=ms;rec.d=ymd();delete rec.seen;S.prog[p.id]=rec;
  S.xp+=gain;
  var d=ymd(),day=S.days[d]||{n:0,ok:0,ms:0,xp:0};day.n++;if(st===3)day.ok++;day.ms+=Math.min(ms,180000);day.xp+=gain;S.days[d]=day;
  var wasUnlocked=LEVELS.map(isUnlocked);
  if(P.mode==='mission'&&S.mission&&S.mission.ids.indexOf(p.id)>=0&&S.mission.done.indexOf(p.id)<0)S.mission.done.push(p.id);
  var bonusMsg='';
  if(S.mission&&!S.mission.bonus&&S.mission.done.length>=S.mission.ids.length&&P.mode==='mission'){S.mission.bonus=true;S.xp+=20;gain+=20;bonusMsg=' Мисията е изпълнена: +20 т.'}
  if(!S.badges.first){S.badges.first=1}
  persist();
  P.over=true;P.last=P.last;
  var tx={hang:'Виси фигура. Винаги питай: виси ли нещо?',fork:'Вилица: една фигура напада две.',pin:'Свръзка: фигурата не може да мръдне, защото зад нея е по-ценна.',tac:'Печелиш материал. Браво за смятането.',mate:'Царят няма къде да избяга.'}[p.tag]||'';
  var nextLabel=P.mode==='mission'?(P.qi+1<P.queue.length?'Следваща задача':'Към края на мисията'):'Следваща';
  var newLv=LEVELS.filter(function(l,i){return isUnlocked(l)&&!wasUnlocked[i]});
  var title=p.type[0]==='m'?'Мат!':'Точно така!';
  var text=(tx||'')+bonusMsg+(newLv.length?' Отключено е ниво '+newLv[0].n+': '+newLv[0].name+'.':'');
  P.res={st:st,title:title,text:text,xp:gain,nextLabel:nextLabel};
  renderPuzzle();
  if(newLv.length)toast('Ново ниво: '+newLv[0].name);
}
function nextAfter(){
  var P=PL;
  if(P.mode==='mission'){
    var q=P.queue,i=P.qi+1;
    if(i<q.length){startPuzzle(pzById(q[i]),'mission',q,i);return}
    leaveToApp();view='today';render();return;
  }
  var ps=PUZ.filter(function(x){return x.lv===P.pz.lv}),cur=ps.indexOf(P.pz);
  var nxt=null;
  for(var k=1;k<=ps.length;k++){var c=ps[(cur+k)%ps.length];if(!(S.prog[c.id]&&S.prog[c.id].st>0)){nxt=c;break}}
  if(nxt&&nxt!==P.pz){startPuzzle(nxt,'level');return}
  leaveToApp();view='levels';render();
}
function doHint(){
  var P=PL;if(!P||!P.ready||P.over||P.res)return;
  var u=P.pz.sol[P.idx];P.hint++;
  if(P.hint===1){P.hintSq=u.slice(0,2);P.msg='Подсказка: тази фигура е ключова.';}
  else{P.hintSq=u.slice(2,4);P.msg='Подсказка: тук отива.';}
  P.cls='';P.sel=null;P.targets=[];renderPuzzle();
}
function doReveal(){
  var P=PL,p=P.pz,g=new Chess(p.fen);P.g=g;P.res=null;P.over=true;P.ready=true;
  var rec=S.prog[p.id]||{st:0};rec.seen=1;S.prog[p.id]=rec;persist();
  var i=0;P.msg='Гледай решението.';P.cls='';repaintBoard();
  function step(){
    if(PL!==P)return;
    if(i>=p.sol.length){P.res={st:0,title:'Решението е показано',text:'Задачата ще се върне в мисия, за да я решиш сам.',xp:0,nextLabel:P.mode==='mission'?'Напред':'Следваща'};renderPuzzle();return}
    var m=p.sol[i];g.move({from:m.slice(0,2),to:m.slice(2,4),promotion:m.length>4?m[4]:undefined});P.last={from:m.slice(0,2),to:m.slice(2,4)};i++;repaintBoard();setTimeout(step,900);
  }
  setTimeout(step,500);
}

document.addEventListener('click',function(e){

  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act');
  if(act==='mission'){var mi=buildMission(),ids=mi.ids.slice(),first=0;for(var i=0;i<ids.length;i++){if(mi.done.indexOf(ids[i])<0){first=i;break}}startPuzzle(pzById(ids[first]),'mission',ids,first)}
  else if(act==='level-play'){var n=Number(a.getAttribute('data-n')),ps=PUZ.filter(function(p){return p.lv===n}),pick=ps.filter(function(p){return !(S.prog[p.id]&&S.prog[p.id].st>0)})[0]||ps[0];if(pick)startPuzzle(pick,'level')}

  else if(act==='li-clear'){setTok('');liMsg='Токенът е изтрит от това устройство.';toast('Токенът е изтрит');render()}
  else if(act==='exp'){var pk=JSON.stringify({v:1,state:S,logs:LOGS_LOCAL}),ta=$('#s-io'),st=$('#io-st');if(ta)ta.value=pk;try{navigator.clipboard.writeText(pk).then(function(){if(st)st.textContent='Копирано.'},function(){if(st)st.textContent='Копирай ръчно от полето.'})}catch(e){if(st)st.textContent='Копирай ръчно от полето.'}}
  else if(act==='imp'){var ta2=$('#s-io'),st2=$('#io-st');try{var o=JSON.parse((ta2&&ta2.value)||'');if(!o||!o.state)throw 0;S=Object.assign(DEF(),o.state);S.set=Object.assign({pause:5,name:'Шахматист'},S.set||{});S.rev=(S.rev||0)+1;LOGS_LOCAL=Array.isArray(o.logs)?o.logs:[];try{localStorage.setItem(LKEY,JSON.stringify(LOGS_LOCAL))}catch(e){}saveLocal();toast('Данните са заредени');render()}catch(e){if(st2)st2.textContent='Не разпознах данните. Постави целия текст от „Копирай данните“.'}}
  else if(act==='del'){var l=allLogs()[Number(a.getAttribute('data-i'))];if(l)delLog(l)}
});

render();initDb();
if(getTok())liSync();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&getTok()&&Date.now()-liLast>60000)liSync()});
})();
</script>
